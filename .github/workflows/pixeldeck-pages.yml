# Publishes the Pixel Deck website (Website/: home, privacy policy and support pages) to GitHub Pages.
# Only that folder is published, never the rest of the repository.
# One-time setup: repository Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pixel Deck website

on:
  push:
    branches: [main, master]
    paths: ["Website/**", ".github/workflows/pixeldeck-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website
      - id: deployment
        uses: actions/deploy-pages@v4
