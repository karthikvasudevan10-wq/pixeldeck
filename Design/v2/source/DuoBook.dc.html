<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Deck — iPhone Duo, Flipbook spread</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#120E1F}
a{color:#FFD23F}a:hover{color:#FFF6E0}
button{font:inherit;cursor:pointer}
@keyframes fbCurl{0%,70%,100%{transform:scale(1)}35%{transform:scale(1.35)}}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; background: #120E1F; color: #F4EEFF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="height: 60px; flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; padding: 0 20px; align-items: center">
    <div role="tablist" aria-label="Left page shows" style="display: flex; gap: 4px; background: #1E1833; padding: 3px; justify-self: start">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="height: 36px; padding: 0 12px; border: 0; background: {{tb.bg}}; color: {{tb.fg}}; font-family: 'Silkscreen', monospace; font-size: 11px">{{tb.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; justify-content: flex-end">
      <span style="font-size: 14px; font-weight: 700; color: #FFF6E0">Slime bounce</span>
      <span style="font-family: 'Silkscreen', monospace; font-size: 11px; color: #A89CC8">{{frameLabel}}/10</span>
      <button type="button" aria-label="Undo" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F4EEFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button type="button" aria-label="Redo" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F4EEFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
      </button>
      <a href="Export.dc.html" aria-label="Export" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A89CC8">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/></svg>
      </a>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; padding: 0 20px; position: relative">

    <div style="display: flex; gap: 10px; min-height: 0">
      <div role="toolbar" aria-label="Drawing tools" aria-orientation="vertical" style="display: flex; flex-direction: column; gap: 6px; justify-content: center">
        <button type="button" aria-label="Pencil" onClick="{{ts.pencil.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.pencil.bg}}; color: {{ts.pencil.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M13 7l4 4"/></svg>
        </button>
        <button type="button" aria-label="Eraser" onClick="{{ts.eraser.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.eraser.bg}}; color: {{ts.eraser.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 20h11"/><path d="M4 15l9-10 7 7-8 8H9z"/><path d="M8 11l6 6"/></svg>
        </button>
        <button type="button" aria-label="Fill" onClick="{{ts.fill.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.fill.bg}}; color: {{ts.fill.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 11l7-7 8 8-7 7z"/><path d="M4 11h15"/><path d="M20 16v4"/></svg>
        </button>
        <button type="button" aria-label="Color picker" onClick="{{ts.picker.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.picker.bg}}; color: {{ts.picker.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M15 4l5 5-3 1-7 7-4 1 1-4 7-7z"/><path d="M4 20l2-2"/></svg>
        </button>
        <button type="button" aria-label="Mirror" onClick="{{ts.mirror.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.mirror.bg}}; color: {{ts.mirror.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 3v18"/><path d="M8 7l-5 5 5 5z"/><path d="M16 7l5 5-5 5z"/></svg>
        </button>
        <button type="button" aria-label="Select" onClick="{{ts.select.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.select.bg}}; color: {{ts.select.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-dasharray="3 3"><rect x="4" y="4" width="16" height="16"/></svg>
        </button>
      </div>
      <div style="flex: 1; min-width: 0; position: relative; background: repeating-conic-gradient(#171129 0 25%, #1C1633 0 50%) 0 0 / 24px 24px; border: 2px solid #2E2650; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{showPrev}}" hint-placeholder-val="{{ true }}">
          <dc-import name="Sprite" sprite="slime" px="{{ 24 }}" playing="{{ false }}" frame="{{prevFrame}}" hint-size="288px,384px"></dc-import>
        </sc-if>
        <sc-if value="{{showPlay}}" hint-placeholder-val="{{ false }}">
          <dc-import name="Sprite" sprite="slime" px="{{ 24 }}" hint-size="288px,384px"></dc-import>
        </sc-if>
        <sc-if value="{{showRef}}" hint-placeholder-val="{{ false }}">
          <button type="button" style="width: 300px; height: 360px; border: 2px dashed #A89CC8; background: transparent; color: #A89CC8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
            <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="3" y="5" width="18" height="14"/><path d="M3 16l5-5 4 4 3-3 6 6"/><rect x="15" y="8" width="2" height="2"/></svg>
            <span style="font-family: 'Silkscreen', monospace; font-size: 13px; color: #F4EEFF">Add reference</span>
            <span style="font-size: 13px; line-height: 1.4; max-width: 220px; text-align: center">Pin a photo or sketch here while you draw on the right page. Tap it with the picker to sample colours.</span>
          </button>
        </sc-if>
        <span style="position: absolute; left: 10px; top: 10px; padding: 4px 8px; background: rgba(18,14,31,0.75); font-family: 'Silkscreen', monospace; font-size: 11px; color: #A89CC8">{{leftCaption}}</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; min-height: 0">
      <div style="flex: 1; min-width: 0; position: relative; background: repeating-conic-gradient(#1A1430 0 25%, #221B3B 0 50%) 0 0 / 24px 24px; border: 2px solid #FF5C8A; display: flex; align-items: center; justify-content: center; overflow: hidden">
        <dc-import name="Sprite" sprite="slime" px="{{ 24 }}" grid="{{ true }}" onion="{{ true }}" onion-color="#FF5C8A" playing="{{ false }}" frame="{{frame}}" hint-size="288px,384px"></dc-import>
        <span style="position: absolute; left: 10px; top: 10px; padding: 4px 8px; background: #FF5C8A; color: #120E1F; font-family: 'Silkscreen', monospace; font-size: 11px">Drawing frame {{frameLabel}}</span>
        <button type="button" aria-label="Turn the page: new frame" onClick="{{nextFrame}}" style="position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; display: flex; align-items: flex-end; justify-content: flex-end">
          <span aria-hidden="true" style="display: block; width: 22px; height: 22px; background: linear-gradient(135deg, #FFF6E0 0 50%, #120E1F 50% 100%); opacity: 0.55; transform-origin: 100% 100%; animation: fbCurl 3s ease-in-out infinite"></span>
        </button>
      </div>
      <div role="radiogroup" aria-label="Palette" style="display: flex; flex-direction: column; gap: 6px; justify-content: center">
        <sc-for list="{{swatches}}" as="s" hint-placeholder-count="10">
          <button type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.name}}" onClick="{{s.pick}}" style="width: 52px; height: 40px; border: 0; background: {{s.hex}}; box-shadow: {{s.ring}}"></button>
        </sc-for>
      </div>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(255,255,255,0.05)"></div>
  </div>

  <div style="height: 84px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 20px">
    <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 56px; height: 56px; flex-shrink: 0; border: 0; background: #FF5C8A; color: #120E1F; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #B8336A">
      <sc-if value="{{showPlay}}" hint-placeholder-val="{{ false }}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>
      </sc-if>
      <sc-if value="{{notPlaying}}" hint-placeholder-val="{{ true }}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9z"/></svg>
      </sc-if>
    </button>
    <div style="flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; align-items: center">
      <sc-for list="{{frames}}" as="f" hint-placeholder-count="10">
        <button type="button" aria-label="Frame {{f.n}}" onClick="{{f.pick}}" style="flex-shrink: 0; width: 44px; height: 58px; padding: 0; background: #1E1833; border: 2px solid {{f.border}}; display: flex; align-items: center; justify-content: center">
          <dc-import name="Sprite" sprite="slime" px="{{ 3 }}" playing="{{ false }}" frame="{{f.i}}" hint-size="36px,48px"></dc-import>
        </button>
      </sc-for>
    </div>
    <button type="button" aria-label="Onion skin" aria-pressed="true" style="height: 44px; padding: 0 12px; border: 2px solid #FF5C8A; background: rgba(255,92,138,0.14); color: #FF5C8A; display: flex; align-items: center; gap: 8px; font-family: 'Silkscreen', monospace; font-size: 11px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/></svg>
      Onion
    </button>
    <button type="button" style="height: 44px; padding: 0 12px; border: 2px solid #2E2650; background: transparent; color: #F4EEFF; font-family: 'Silkscreen', monospace; font-size: 11px">8 fps</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const frame = st.frame ?? 3;
    const left = st.left || 'prev';
    const tool = st.tool || 'pencil';
    const color = st.color || 'g';
    const playing = left === 'play';
    const tabDefs = [['prev','Last frame'],['play','Playback'],['ref','Reference']];
    const tabs = tabDefs.map((d) => ({ label: d[1], sel: d[0] === left ? 'true' : 'false', bg: d[0] === left ? '#FFF6E0' : 'transparent', fg: d[0] === left ? '#120E1F' : '#A89CC8', pick: () => this.setState({ left: d[0] }) }));
    const toolDefs = [['pencil','Pencil','PEN'],['eraser','Eraser','ERS'],['fill','Fill','FIL'],['picker','Color picker','PIK'],['mirror','Mirror','MIR'],['select','Select','SEL']];
    const ts = {};
    toolDefs.forEach((d) => { ts[d[0]] = { bg: d[0] === tool ? '#FFF6E0' : '#2A2347', fg: d[0] === tool ? '#120E1F' : '#F4EEFF', pick: () => this.setState({ tool: d[0] }) }; });
    const pal = [['k','#1B1530','Outline'],['w','#FFF6E0','Cream'],['g','#7BE07B','Slime green'],['d','#2E9E5B','Moss'],['y','#FFD23F','Yellow'],['o','#FF8B3D','Ember'],['p','#FF5C8A','Pink'],['l','#C8B6FF','Lavender'],['n','#3A86FF','Sky'],['u','#9C6B3C','Bark']];
    const swatches = pal.map((p) => ({ hex: p[1], name: p[2], checked: p[0] === color ? 'true' : 'false', ring: p[0] === color ? '0 0 0 2px #120E1F, 0 0 0 4px #FFF6E0' : 'inset 0 0 0 1px #2E2650', pick: () => this.setState({ color: p[0] }) }));
    const frames = [];
    for (let i = 0; i < 10; i++) frames.push({ i, n: i + 1, border: i === frame ? '#FF5C8A' : (i === (frame + 9) % 10 ? '#A89CC8' : '#2E2650'), pick: () => this.setState({ frame: i }) });
    const prevFrame = (frame + 9) % 10;
    return {
      tabs, ts, swatches, frames, frame, prevFrame,
      frameLabel: String(frame + 1).padStart(2, '0'),
      showPrev: left === 'prev', showPlay: playing, showRef: left === 'ref', notPlaying: !playing,
      leftCaption: left === 'prev' ? 'Frame ' + String(prevFrame + 1).padStart(2, '0') : (left === 'play' ? 'Live loop · 8 fps' : 'Reference'),
      playLabel: playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ left: playing ? 'prev' : 'play' }),
      nextFrame: () => this.setState({ frame: (frame + 1) % 10, left: 'prev' })
    };
  }
}
</script>
</body>
</html>
