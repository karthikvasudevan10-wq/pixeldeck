<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Deck — iPhone Duo, Easel mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#120E1F}
a{color:#FFD23F}a:hover{color:#FFF6E0}
button{font:inherit;cursor:pointer}
@keyframes fbCurl{0%,70%,100%{transform:scale(1)}35%{transform:scale(1.35)}}
</style>
</helmet>
<div style="width: 768px; height: 1024px; box-sizing: border-box; background: #120E1F; color: #F4EEFF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <section aria-label="Stage, upright half" style="height: 504px; flex-shrink: 0; position: relative; overflow: hidden; background: #1A1430">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; height: 150px; background: #120E1F"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 150px; right: 0; height: 120px; background: #171129"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 270px; right: 0; height: 110px; background: #1E1736"></div>
    <sc-for list="{{stars}}" as="s" hint-placeholder-count="0">
      <div aria-hidden="true" style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: 4px; height: 4px; background: #FFF6E0; opacity: {{s.o}}"></div>
    </sc-for>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 440px; bottom: 0; background: #2E2452"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 440px; height: 8px; background: #4A3B7A"></div>

    <div style="position: absolute; left: 24px; top: 20px; display: flex; align-items: center; gap: 10px">
      <span style="padding: 5px 10px; background: #FF5C8A; color: #120E1F; font-family: 'Silkscreen', monospace; font-size: 11px">Easel mode</span>
      <span style="font-size: 13px; color: #A89CC8">Live loop of everything you draw below</span>
    </div>

    <div style="position: absolute; left: 252px; top: 88px">
      <dc-import name="Sprite" sprite="slime" px="{{ 22 }}" fps="{{fps}}" hint-size="264px,352px"></dc-import>
    </div>

    <div style="position: absolute; right: 28px; top: 120px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <span style="font-family: 'Silkscreen', monospace; font-size: 44px; line-height: 1; color: #FFF6E0">{{fps}}</span>
      <span style="font-family: 'Silkscreen', monospace; font-size: 12px; color: #A89CC8">fps</span>
      <span style="margin-top: 18px; font-family: 'Silkscreen', monospace; font-size: 28px; line-height: 1; color: #FFF6E0">10</span>
      <span style="font-family: 'Silkscreen', monospace; font-size: 12px; color: #A89CC8">frames</span>
    </div>

    <div style="position: absolute; left: 28px; top: 120px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 700; color: #FFF6E0">Slime bounce</span>
      <span style="font-size: 13px; color: #A89CC8">12×16 px</span>
    </div>
  </section>

  <div aria-hidden="true" style="height: 16px; flex-shrink: 0; background: #0B0814; display: flex; align-items: center; justify-content: center">
    <div style="width: 64px; height: 4px; background: #2E2650"></div>
  </div>

  <section aria-label="Desk, flat half" style="flex: 1; min-height: 0; display: flex; gap: 14px; padding: 16px; background: #120E1F">
    <div style="display: flex; flex-direction: column; gap: 6px; justify-content: center">
      <div role="toolbar" aria-label="Drawing tools" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <button type="button" aria-label="Pencil" onClick="{{ts.pencil.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.pencil.bg}}; color: {{ts.pencil.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M13 7l4 4"/></svg>
        </button>
        <button type="button" aria-label="Eraser" onClick="{{ts.eraser.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.eraser.bg}}; color: {{ts.eraser.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 20h11"/><path d="M4 15l9-10 7 7-8 8H9z"/><path d="M8 11l6 6"/></svg>
        </button>
        <button type="button" aria-label="Fill" onClick="{{ts.fill.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.fill.bg}}; color: {{ts.fill.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 11l7-7 8 8-7 7z"/><path d="M4 11h15"/><path d="M20 16v4"/></svg>
        </button>
        <button type="button" aria-label="Color picker" onClick="{{ts.picker.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.picker.bg}}; color: {{ts.picker.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M15 4l5 5-3 1-7 7-4 1 1-4 7-7z"/><path d="M4 20l2-2"/></svg>
        </button>
        <button type="button" aria-label="Mirror" onClick="{{ts.mirror.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.mirror.bg}}; color: {{ts.mirror.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 3v18"/><path d="M8 7l-5 5 5 5z"/><path d="M16 7l5 5-5 5z"/></svg>
        </button>
        <button type="button" aria-label="Select" onClick="{{ts.select.pick}}" style="width: 52px; height: 52px; border: 0; background: {{ts.select.bg}}; color: {{ts.select.fg}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><rect x="4" y="4" width="16" height="16"/></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 10px">
        <button type="button" aria-label="Undo" style="width: 52px; height: 44px; border: 0; background: transparent; color: #F4EEFF; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
        </button>
        <button type="button" aria-label="Redo" style="width: 52px; height: 44px; border: 0; background: transparent; color: #F4EEFF; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
        </button>
      </div>
    </div>

    <div style="flex: 1; min-width: 0; position: relative; background: repeating-conic-gradient(#1A1430 0 25%, #221B3B 0 50%) 0 0 / 22px 22px; border: 2px solid #2E2650; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <dc-import name="Sprite" sprite="slime" px="{{ 22 }}" grid="{{ true }}" onion="{{ true }}" onion-color="#FF5C8A" playing="{{ false }}" frame="{{frame}}" hint-size="264px,352px"></dc-import>
      <span style="position: absolute; left: 10px; top: 10px; padding: 4px 8px; background: rgba(18,14,31,0.75); font-family: 'Silkscreen', monospace; font-size: 11px; color: #A89CC8">Frame {{frameLabel}}/10</span>
      <button type="button" aria-label="Turn the page: new frame" onClick="{{nextFrame}}" style="position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; display: flex; align-items: flex-end; justify-content: flex-end">
        <span aria-hidden="true" style="display: block; width: 22px; height: 22px; background: linear-gradient(135deg, #FFF6E0 0 50%, #120E1F 50% 100%); opacity: 0.55; transform-origin: 100% 100%; animation: fbCurl 3s ease-in-out infinite"></span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; justify-content: center">
      <div role="radiogroup" aria-label="Palette" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{swatches}}" as="s" hint-placeholder-count="10">
          <button type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.name}}" onClick="{{s.pick}}" style="width: 52px; height: 40px; border: 0; background: {{s.hex}}; box-shadow: {{s.ring}}"></button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 10px">
        <button type="button" aria-label="Slower" onClick="{{slower}}" style="width: 52px; height: 44px; border: 2px solid #2E2650; background: transparent; color: #F4EEFF; font-family: 'Silkscreen', monospace; font-size: 16px">−</button>
        <button type="button" aria-label="Faster" onClick="{{faster}}" style="width: 52px; height: 44px; border: 2px solid #2E2650; background: transparent; color: #F4EEFF; font-family: 'Silkscreen', monospace; font-size: 16px">+</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const frame = st.frame ?? 3;
    const tool = st.tool || 'pencil';
    const color = st.color || 'g';
    const fps = st.fps ?? 8;
    const ts = {};
    ['pencil','eraser','fill','picker','mirror','select'].forEach((k) => { ts[k] = { bg: k === tool ? '#FFF6E0' : '#2A2347', fg: k === tool ? '#120E1F' : '#F4EEFF', pick: () => this.setState({ tool: k }) }; });
    const pal = [['k','#1B1530','Outline'],['w','#FFF6E0','Cream'],['g','#7BE07B','Slime green'],['d','#2E9E5B','Moss'],['y','#FFD23F','Yellow'],['o','#FF8B3D','Ember'],['p','#FF5C8A','Pink'],['l','#C8B6FF','Lavender'],['n','#3A86FF','Sky'],['u','#9C6B3C','Bark']];
    const swatches = pal.map((p) => ({ hex: p[1], name: p[2], checked: p[0] === color ? 'true' : 'false', ring: p[0] === color ? '0 0 0 2px #120E1F, 0 0 0 4px #FFF6E0' : 'inset 0 0 0 1px #2E2650', pick: () => this.setState({ color: p[0] }) }));
    const stars = [[40,70,1],[120,40,0.5],[200,96,1],[330,30,1],[420,64,0.5],[520,40,1],[600,90,1],[700,56,0.5],[90,180,1],[640,200,1],[180,240,0.5],[560,250,1]].map((p) => ({ x: p[0], y: p[1], o: p[2] }));
    return {
      ts, swatches, stars, frame, fps,
      frameLabel: String(frame + 1).padStart(2, '0'),
      nextFrame: () => this.setState({ frame: (frame + 1) % 10 }),
      slower: () => this.setState({ fps: Math.max(1, fps - 1) }),
      faster: () => this.setState({ fps: Math.min(24, fps + 1) })
    };
  }
}
</script>
</body>
</html>
