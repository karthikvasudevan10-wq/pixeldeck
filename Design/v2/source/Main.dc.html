<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Deck — Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#120E1F}
a{color:#FFD23F}a:hover{color:#FFF6E0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #120E1F; color: #F4EEFF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: relative; width: 390px; height: 452px; overflow: hidden; background: #1A1430; flex-shrink: 0">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 120px; background: #120E1F"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 120px; width: 390px; height: 100px; background: #171129"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 220px; width: 390px; height: 90px; background: #1E1736"></div>
    <sc-for list="{{stars}}" as="s" hint-placeholder-count="0">
      <div aria-hidden="true" style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.size}}px; height: {{s.size}}px; background: {{s.c}}; opacity: {{s.o}}"></div>
    </sc-for>
    <div style="position: absolute; right: 40px; top: 56px">
      <dc-import name="Sprite" sprite="moon" px="{{ 7 }}" hint-size="56px,56px"></dc-import>
    </div>
    <div style="position: absolute; left: 30px; top: 104px">
      <dc-import name="Sprite" sprite="ghost" px="{{ 5 }}" hint-size="50px,60px"></dc-import>
    </div>
    <div style="position: absolute; left: 244px; top: 170px">
      <dc-import name="Sprite" sprite="coin" px="{{ 4 }}" hint-size="32px,32px"></dc-import>
    </div>
    <div style="position: absolute; left: 292px; top: 210px">
      <dc-import name="Sprite" sprite="coin" px="{{ 3 }}" fps="{{ 6 }}" hint-size="24px,24px"></dc-import>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 300px; width: 110px; height: 40px; background: #2A2148"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 280px; width: 60px; height: 20px; background: #2A2148"></div>
    <div aria-hidden="true" style="position: absolute; left: 260px; top: 290px; width: 130px; height: 50px; background: #2A2148"></div>
    <div aria-hidden="true" style="position: absolute; left: 320px; top: 268px; width: 70px; height: 22px; background: #2A2148"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 340px; width: 390px; height: 112px; background: #2E2452"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 340px; width: 390px; height: 8px; background: #4A3B7A"></div>
    <div aria-hidden="true" style="position: absolute; left: 40px; top: 372px; width: 16px; height: 8px; background: #3B2F63"></div>
    <div aria-hidden="true" style="position: absolute; left: 180px; top: 400px; width: 24px; height: 8px; background: #3B2F63"></div>
    <div aria-hidden="true" style="position: absolute; left: 320px; top: 384px; width: 16px; height: 8px; background: #3B2F63"></div>
    <div style="position: absolute; left: 92px; top: 212px">
      <dc-import name="Sprite" sprite="slime" px="{{ 8 }}" hint-size="96px,128px"></dc-import>
    </div>
    <div style="position: absolute; left: 236px; top: 256px">
      <dc-import name="Sprite" sprite="flame" px="{{ 7 }}" hint-size="70px,84px"></dc-import>
    </div>
    <div style="position: absolute; left: 20px; top: 20px; display: flex; align-items: center; gap: 10px">
      <div style="width: 28px; height: 28px; background: #FF5C8A; display: flex; align-items: center; justify-content: center">
        <dc-import name="Sprite" sprite="slime" px="{{ 2 }}" playing="{{ false }}" frame="{{ 0 }}" hint-size="24px,32px"></dc-import>
      </div>
      <span style="font-family: 'Silkscreen', monospace; font-size: 18px; letter-spacing: 1px; color: #FFF6E0">Pixel Deck</span>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; padding: 28px 24px 32px; gap: 16px">
    <h1 style="margin: 0; font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 36px; line-height: 1.05; letter-spacing: -0.5px; color: #FFF6E0">Draw it.<br>Move it.<br><span style="color: #FF5C8A">Love it.</span></h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A89CC8">Pixel art and frame-by-frame animation, built for your thumb. Swipe left for the next frame — the last one stays underneath as an onion skin.</p>
    <div style="flex: 1"></div>
    <a href="Studio.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; background: #FF5C8A; color: #120E1F; text-decoration: none; font-family: 'Silkscreen', monospace; font-size: 18px; box-shadow: 0 6px 0 #B8336A">Start drawing</a>
    <a href="Gestures.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 500; text-decoration: none">See how the swipes work</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._iv = setInterval(() => this.setState({ t: ((this.state && this.state.t) || 0) + 1 }), 420);
  }
  componentWillUnmount() { if (this._iv) clearInterval(this._iv); }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const pts = [[24,62,4],[70,30,4],[118,84,6],[160,40,4],[204,96,4],[250,26,6],[300,140,4],[352,170,4],[140,150,4],[190,190,6],[30,210,4],[90,176,4],[340,230,4],[226,130,4],[60,250,4]];
    const stars = pts.map((p, i) => {
      const phase = (t + i * 3) % 6;
      return { x: p[0], y: p[1], size: p[2], c: i % 4 === 0 ? '#FFD23F' : '#FFF6E0', o: phase === 0 ? 0.15 : (phase === 1 ? 0.5 : 1) };
    });
    return { stars };
  }
}
</script>
</body>
</html>
