<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Deck — Two swipes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#120E1F}
a{color:#FFD23F}a:hover{color:#FFF6E0}
@keyframes fbSwipeLeft{0%{transform:translateX(70px);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateX(-70px);opacity:0}}
@keyframes fbSwipeRight{0%{transform:translateX(-70px);opacity:0}15%{opacity:1}75%{opacity:1}100%{transform:translateX(70px);opacity:0}}
@keyframes fbOldOut{0%,30%{transform:translateX(0)}60%,92%{transform:translateX(120%)}100%{transform:translateX(0)}}
@keyframes fbNewIn{0%,30%{transform:translateX(-120%)}60%,92%{transform:translateX(0)}100%{transform:translateX(-120%)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #120E1F; color: #F4EEFF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 20px 28px; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <span style="font-family: 'Silkscreen', monospace; font-size: 13px; color: #A89CC8; letter-spacing: 1px">2 of 2</span>
    <a href="Studio.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 4px; font-size: 15px; font-weight: 500; text-decoration: none">Skip</a>
  </div>
  <h1 style="margin: 0; font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 28px; line-height: 1.1; color: #FFF6E0">Two swipes.<br>That’s the whole<br>workflow.</h1>

  <div style="background: #1E1833; border: 2px solid #2E2650; padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; height: 158px; background: repeating-conic-gradient(#1A1430 0 25%, #221B3B 0 50%) 0 0 / 16px 16px; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <dc-import name="Sprite" sprite="slime" px="{{ 8 }}" onion="{{ true }}" fps="{{ 3 }}" hint-size="96px,128px"></dc-import>
      <div aria-hidden="true" style="position: absolute; right: 28px; bottom: 20px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,246,224,0.85); box-shadow: 0 0 0 6px rgba(255,246,224,0.18); animation: fbSwipeLeft 1.6s ease-in-out infinite"></div>
      <div style="position: absolute; left: 10px; top: 10px; padding: 4px 8px; background: #FF5C8A; color: #120E1F; font-family: 'Silkscreen', monospace; font-size: 11px">Onion skin on</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; background: #FF5C8A; color: #120E1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Silkscreen', monospace; font-size: 16px; color: #FFF6E0">Swipe left · new frame</span>
        <span style="font-size: 14px; line-height: 1.4; color: #A89CC8">Your last frame stays underneath in pink, so every pose lines up.</span>
      </div>
    </div>
  </div>

  <div style="background: #1E1833; border: 2px solid #2E2650; padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; height: 132px; background: #120E1F; overflow: hidden">
      <div style="position: absolute; inset: 12px 70px; background: repeating-conic-gradient(#1A1430 0 25%, #221B3B 0 50%) 0 0 / 16px 16px; display: flex; align-items: center; justify-content: center; animation: fbOldOut 3.2s ease-in-out infinite">
        <dc-import name="Sprite" sprite="flame" px="{{ 7 }}" hint-size="70px,84px"></dc-import>
      </div>
      <div style="position: absolute; inset: 12px 70px; background: repeating-conic-gradient(#1A1430 0 25%, #221B3B 0 50%) 0 0 / 16px 16px; border: 2px dashed #FFD23F; box-sizing: border-box; display: flex; align-items: center; justify-content: center; animation: fbNewIn 3.2s ease-in-out infinite">
        <span style="font-family: 'Silkscreen', monospace; font-size: 12px; color: #FFD23F">Blank canvas</span>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 28px; bottom: 18px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,246,224,0.85); box-shadow: 0 0 0 6px rgba(255,246,224,0.18); animation: fbSwipeRight 1.6s ease-in-out infinite"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; background: #FFD23F; color: #120E1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Silkscreen', monospace; font-size: 16px; color: #FFF6E0">Swipe right · new canvas</span>
        <span style="font-size: 14px; line-height: 1.4; color: #A89CC8">Start a fresh piece whenever an idea hits.</span>
      </div>
    </div>
  </div>

  <div style="flex: 1"></div>
  <a href="Studio.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; background: #FF5C8A; color: #120E1F; text-decoration: none; font-family: 'Silkscreen', monospace; font-size: 18px; box-shadow: 0 6px 0 #B8336A">Got it</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
