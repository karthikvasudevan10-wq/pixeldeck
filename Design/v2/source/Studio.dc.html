<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Deck — Studio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
@keyframes fbNudgeL{0%,70%,100%{transform:translateX(0);opacity:.35}35%{transform:translateX(-3px);opacity:.6}}
@keyframes fbNudgeR{0%,70%,100%{transform:translateX(0);opacity:.35}35%{transform:translateX(3px);opacity:.6}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; min-height: 0; position: relative; background: repeating-conic-gradient({{t.checkA}} 0 25%, {{t.checkB}} 0 50%) 0 0 / 28px 28px; display: flex; align-items: center; justify-content: center">
    <dc-import name="Sprite" sprite="slime" px="{{ 28 }}" grid="{{ true }}" grid-color="{{t.grid}}" onion="{{onion}}" onion-color="{{t.accent}}" playing="{{playing}}" frame="{{frame}}" hint-size="336px,448px"></dc-import>

    <div style="position: absolute; left: 12px; top: 14px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: {{t.chip}}">
      <span style="font-size: 12px; font-weight: 500; color: {{t.text}}">Slime bounce</span>
      <span style="font-family: 'Silkscreen', monospace; font-size: 11px; color: {{t.muted}}">{{frameLabel}}/10</span>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 6px; top: 50%; margin-top: -10px; animation: fbNudgeR 2.4s ease-in-out infinite">
      <svg width="9" height="15" viewBox="0 0 3 5" shape-rendering="crispEdges" fill="{{t.accent2}}"><rect x="0" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/></svg>
    </div>
    <div aria-hidden="true" style="position: absolute; right: 6px; top: 50%; margin-top: -10px; animation: fbNudgeL 2.4s ease-in-out infinite">
      <svg width="9" height="15" viewBox="0 0 3 5" shape-rendering="crispEdges" fill="{{t.accent}}"><rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/></svg>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="10">
        <div style="width: {{d.w}}px; height: 4px; background: {{d.c}}"></div>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; background: {{t.surface}}; border-top: 2px solid {{t.line}}; padding: 12px 12px 18px; display: flex; flex-direction: column; gap: 10px">

    <div style="display: flex; gap: 8px; align-items: center">
      <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 52px; height: 52px; flex-shrink: 0; border: 0; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 {{t.accentShadow}}">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>
        </sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ true }}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9z"/></svg>
        </sc-if>
      </button>
      <div style="flex: 1; min-width: 0; display: flex; gap: 5px; overflow-x: auto">
        <sc-for list="{{frames}}" as="f" hint-placeholder-count="10">
          <button type="button" aria-label="Frame {{f.n}}" onClick="{{f.pick}}" style="flex-shrink: 0; width: 40px; height: 52px; padding: 0; background: {{t.bg}}; border: 2px solid {{f.border}}; display: flex; align-items: center; justify-content: center">
            <dc-import name="Sprite" sprite="slime" px="{{ 3 }}" playing="{{ false }}" frame="{{f.i}}" hint-size="36px,48px"></dc-import>
          </button>
        </sc-for>
        <button type="button" aria-label="Add frame" style="flex-shrink: 0; width: 40px; height: 52px; padding: 0; background: transparent; border: 2px dashed {{t.accent}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div role="radiogroup" aria-label="Palette" style="display: flex; gap: 6px">
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="10">
        <button type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.name}}" onClick="{{s.pick}}" style="flex: 1; height: 34px; border: 0; background: {{s.hex}}; box-shadow: {{s.ring}}"></button>
      </sc-for>
    </div>

    <div role="toolbar" aria-label="Drawing tools" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <button type="button" aria-label="Pencil" onClick="{{pickPencil}}" style="height: 52px; border: 0; background: {{ts.pencil.bg}}; color: {{ts.pencil.fg}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M13 7l4 4"/></svg>
      </button>
      <button type="button" aria-label="Eraser" onClick="{{pickEraser}}" style="height: 52px; border: 0; background: {{ts.eraser.bg}}; color: {{ts.eraser.fg}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 20h11"/><path d="M4 15l9-10 7 7-8 8H9z"/><path d="M8 11l6 6"/></svg>
      </button>
      <button type="button" aria-label="Fill" onClick="{{pickFill}}" style="height: 52px; border: 0; background: {{ts.fill.bg}}; color: {{ts.fill.fg}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 11l7-7 8 8-7 7z"/><path d="M4 11h15"/><path d="M20 16v4"/></svg>
      </button>
      <button type="button" aria-label="Color picker" onClick="{{pickPicker}}" style="height: 52px; border: 0; background: {{ts.picker.bg}}; color: {{ts.picker.fg}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M15 4l5 5-3 1-7 7-4 1 1-4 7-7z"/><path d="M4 20l2-2"/></svg>
      </button>
      <button type="button" aria-label="Mirror" onClick="{{pickMirror}}" style="height: 52px; border: 0; background: {{ts.mirror.bg}}; color: {{ts.mirror.fg}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 3v18"/><path d="M8 7l-5 5 5 5z"/><path d="M16 7l5 5-5 5z"/></svg>
      </button>
      <button type="button" aria-label="Select" onClick="{{pickSelect}}" style="height: 52px; border: 0; background: {{ts.select.bg}}; color: {{ts.select.fg}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><rect x="4" y="4" width="16" height="16"/></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <a href="Gallery.dc.html" aria-label="Gallery" style="height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
      </a>
      <button type="button" aria-label="Undo" style="height: 44px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button type="button" aria-label="Redo" style="height: 44px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
      </button>
      <button type="button" aria-label="Onion skin" aria-pressed="{{onionPressed}}" onClick="{{toggleOnion}}" style="height: 44px; border: 0; background: {{onionBg}}; color: {{onionFg}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/></svg>
      </button>
      <button type="button" aria-label="Frame rate" style="height: 44px; border: 0; background: transparent; color: {{t.text}}; font-family: 'Silkscreen', monospace; font-size: 11px">8fps</button>
      <a href="Export.dc.html" aria-label="Export" style="height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      night:  { bg:'#120E1F', surface:'#1E1833', line:'#2E2650', text:'#F4EEFF', muted:'#A89CC8', accent:'#FF5C8A', accentShadow:'#B8336A', accent2:'#FFD23F', onAccent:'#120E1F', checkA:'#1A1430', checkB:'#221B3B', grid:'rgba(255,255,255,0.07)', chip:'rgba(18,14,31,0.7)', tool:'#2A2347', toolOn:'#FFF6E0', toolOnFg:'#120E1F' },
      paper:  { bg:'#F4EFE6', surface:'#FFFDF8', line:'#E2D9C8', text:'#1F1A14', muted:'#6B6256', accent:'#E8452C', accentShadow:'#A62E1A', accent2:'#2F6FEB', onAccent:'#1F1A14', checkA:'#EFE8DC', checkB:'#E6DDCD', grid:'rgba(31,26,20,0.08)', chip:'rgba(255,253,248,0.85)', tool:'#F1EBE0', toolOn:'#1F1A14', toolOnFg:'#FFFDF8' },
      pocket: { bg:'#0F1F14', surface:'#17291C', line:'#2C4A33', text:'#E3F2C1', muted:'#9DBB86', accent:'#C6F35B', accentShadow:'#7FA331', accent2:'#FF9F43', onAccent:'#0F1F14', checkA:'#13251A', checkB:'#182D1F', grid:'rgba(227,242,193,0.07)', chip:'rgba(15,31,20,0.75)', tool:'#21392A', toolOn:'#E3F2C1', toolOnFg:'#0F1F14' },
      neon:   { bg:'#05060F', surface:'#0E1124', line:'#232845', text:'#EAF2FF', muted:'#8E9AC4', accent:'#2EE6D6', accentShadow:'#159C91', accent2:'#FF4FD8', onAccent:'#05060F', checkA:'#090B19', checkB:'#0E1122', grid:'rgba(46,230,214,0.08)', chip:'rgba(5,6,15,0.75)', tool:'#171B36', toolOn:'#2EE6D6', toolOnFg:'#05060F' },
      sunset: { bg:'#2A1220', surface:'#3A1A2C', line:'#55283F', text:'#FFEDE0', muted:'#E0AFA6', accent:'#FFB347', accentShadow:'#C27A1C', accent2:'#FF6F61', onAccent:'#2A1220', checkA:'#321627', checkB:'#3A1B2E', grid:'rgba(255,237,224,0.07)', chip:'rgba(42,18,32,0.75)', tool:'#4A2338', toolOn:'#FFEDE0', toolOnFg:'#2A1220' }
    };
    const t = THEMES[this.props.theme ?? 'night'] || THEMES.night;
    const st = this.state || {};
    const tool = st.tool || 'pencil';
    const color = st.color || 'g';
    const frame = st.frame ?? 3;
    const playing = !!st.playing;
    const onion = st.onion ?? true;
    const ts = {};
    ['pencil','eraser','fill','picker','mirror','select'].forEach((k) => { ts[k] = k === tool ? { bg: t.toolOn, fg: t.toolOnFg } : { bg: t.tool, fg: t.text }; });
    const pick = (k) => () => this.setState({ tool: k });
    const pal = [['k','#1B1530','Outline'],['w','#FFF6E0','Cream'],['g','#7BE07B','Slime green'],['d','#2E9E5B','Moss'],['y','#FFD23F','Yellow'],['o','#FF8B3D','Ember'],['p','#FF5C8A','Pink'],['l','#C8B6FF','Lavender'],['n','#3A86FF','Sky'],['u','#9C6B3C','Bark']];
    const swatches = pal.map((p) => ({
      hex: p[1], name: p[2], checked: p[0] === color ? 'true' : 'false',
      ring: p[0] === color ? '0 0 0 2px ' + t.surface + ', 0 0 0 4px ' + t.text : 'inset 0 0 0 1px ' + t.line,
      pick: () => this.setState({ color: p[0] })
    }));
    const frames = [];
    const dots = [];
    for (let i = 0; i < 10; i++) {
      frames.push({ i, n: i + 1, border: i === frame ? t.accent : t.line, pick: () => this.setState({ frame: i, playing: false }) });
      dots.push({ w: i === frame ? 12 : 4, c: i === frame ? t.accent : t.muted });
    }
    return {
      t, ts, swatches, frames, dots, frame, playing, paused: !playing, onion,
      playLabel: playing ? 'Pause' : 'Play',
      frameLabel: String(frame + 1).padStart(2, '0'),
      togglePlay: () => this.setState({ playing: !playing }),
      toggleOnion: () => this.setState({ onion: !onion }),
      onionPressed: onion ? 'true' : 'false',
      onionBg: onion ? t.tool : 'transparent',
      onionFg: onion ? t.accent : t.muted,
      pickPencil: pick('pencil'), pickEraser: pick('eraser'), pickFill: pick('fill'),
      pickPicker: pick('picker'), pickMirror: pick('mirror'), pickSelect: pick('select')
    };
  }
}
</script>
</body>
</html>
